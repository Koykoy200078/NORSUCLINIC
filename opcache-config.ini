# OPcache Configuration for Laravel Performance Optimization
# Add this to your php.ini file or create a separate opcache.ini file

# Enable OPcache
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1

# Memory Settings
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

# Performance Settings  
opcache.revalidate_freq=0
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.enable_file_override=1

# Optimization Settings
opcache.optimization_level=0x7FFEBFFF
opcache.dups_fix=1
opcache.max_file_size=0

# For development (set to 1), for production (set to 0)
opcache.validate_timestamps=0

# Prevent crashes and improve stability
opcache.fast_shutdown=1
opcache.blacklist_filename=""

# Cache preloading (Laravel 8+)
# opcache.preload=/path/to/your/laravel/app/preload.php
# opcache.preload_user=www-data